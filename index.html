<style>
  :root{
    --bg-0:#0c0e11;
    --bg-1:#15181c;
    --panel:#1b1f24;
    --amber:#ff9d3d;
    --amber-dim:#a5652a;
    --steel:#3d4c5c;
    --steel-light:#5b7086;
    --text:#e8e6df;
    --text-dim:#8b9099;
    --danger:#e05a4e;
    --ok:#5ec49a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-0);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:linear-gradient(180deg,var(--bg-1) 0%, var(--bg-0) 100%);
    display:flex;
    flex-direction:column;
    padding:16px 16px 100px;
  }

  /* ---------- 상단 디스플레이 ---------- */
  .display{
    background:#08090b;
    border:1px solid #23272c;
    border-radius:18px;
    padding:20px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6);
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .display .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .live-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--text-dim);
    display:inline-block;
    margin-right:6px;
  }
  .live-dot.on{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .live-dot.err{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .status-label{ font-size:12px; color:var(--text-dim); letter-spacing:.02em; }
  .region-tag{
    font-size:12px; color:var(--text-dim);
    border:1px solid #2c3138; padding:3px 9px; border-radius:20px;
  }
  .station-name{
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size:28px;
    letter-spacing:.03em;
    color:var(--amber);
    text-shadow:0 0 14px rgba(255,157,61,.35);
    line-height:1.25;
    min-height:36px;
    word-break:keep-all;
  }
  .station-name.placeholder{ color:var(--text-dim); text-shadow:none; font-size:18px; }
  .sub-line{ margin-top:6px; font-size:13px; color:var(--text-dim); min-height:18px; }

  /* ---------- 트랜스포트 (재생/이전/다음) ---------- */
  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin: 6px 0 20px;
  }
  .t-btn{
    background:var(--panel);
    border:1px solid #262b31;
    color:var(--text);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    user-select:none;
    transition:transform .08s ease, background .15s ease;
  }
  .t-btn:active{ transform:scale(.93); background:#20252b; }
  .t-btn.small{ width:58px;height:58px; font-size:22px; }
  .t-btn.big{
    width:86px;height:86px; font-size:30px;
    background:linear-gradient(160deg, #2a3138, #171a1e);
    border:1px solid var(--steel-light);
  }
  .t-btn.big.playing{ border-color:var(--amber); color:var(--amber); }

  /* ---------- 프리셋 ---------- */
  .section-title{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--text-dim); margin: 4px 0 8px;
  }
  .edit-toggle{
    background:none; border:1px solid #2c3138; color:var(--text-dim);
    padding:5px 10px; border-radius:20px; font-size:12px; cursor:pointer;
  }
  .edit-toggle.active{ color:var(--amber); border-color:var(--amber-dim); }
  .presets{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .preset{
    background:var(--panel);
    border:1px solid #262b31;
    border-radius:12px;
    padding:10px 8px;
    min-height:64px;
    display:flex; flex-direction:column; justify-content:center;
    cursor:pointer;
  }
  .preset .p-num{ font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .preset .p-name{ font-size:13.5px; line-height:1.3; word-break:keep-all; }
  .preset.empty .p-name{ color:var(--text-dim); font-size:12px; }
  .preset.active{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset; }
  .presets.editing .preset{ border-style:dashed; border-color:var(--steel-light); }

  /* ---------- 검색 + 목록 ---------- */
  .search-box{
    width:100%;
    background:var(--panel);
    border:1px solid #262b31;
    border-radius:12px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    margin-bottom:14px;
  }
  .search-box::placeholder{ color:var(--text-dim); }

  .group{ margin-bottom:6px; }
  .group-title{
    font-size:12px; color:var(--steel-light); letter-spacing:.04em;
    margin:14px 0 6px 2px;
  }
  .channel-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px;
    background:var(--panel);
    border:1px solid #21252a;
    border-radius:12px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .channel-row.active{ border-color:var(--amber-dim); background:#241d16; }
  .channel-row .c-left{ display:flex; flex-direction:column; }
  .channel-row .c-name{ font-size:15px; }
  .channel-row .c-region{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .channel-row .c-play-icon{ font-size:18px; color:var(--text-dim); }
  .channel-row.active .c-play-icon{ color:var(--amber); }

  /* ---------- 토스트 ---------- */
  .toast{
    position:fixed; left:50%; bottom:120px; transform:translateX(-50%);
    background:#20242a; border:1px solid #333a42; color:var(--text);
    padding:10px 16px; border-radius:20px; font-size:13.5px;
    max-width:88%; text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:50;
  }
  .toast.show{ opacity:1; }

  /* ---------- 마이크 버튼 ---------- */
  .mic-wrap{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    z-index:40;
    width:100%; max-width:480px; pointer-events:none;
  }
  .mic-hint{
    background:rgba(20,22,26,.9); border:1px solid #2c3138;
    padding:6px 14px; border-radius:16px; font-size:12.5px; color:var(--text-dim);
    max-width:80%; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .2s ease;
  }
  .mic-hint.show{ opacity:1; }
  .mic-btn{
    pointer-events:auto;
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(160deg,#2a3138,#14171a);
    border:1px solid var(--steel-light);
    color:var(--text);
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.5);
    cursor:pointer;
  }
  .mic-btn.listening{
    border-color:var(--amber);
    color:var(--amber);
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,157,61,.5); }
    70%{ box-shadow:0 0 0 16px rgba(255,157,61,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,157,61,0); }
  }

  audio{ display:none; }

  /* ---------- 이퀄라이저 (재생 중 표시) ---------- */
  .eq-corner{
    position:absolute; right:18px; bottom:16px;
    display:flex; align-items:flex-end; gap:3px; height:20px;
    z-index:2;
  }
  .eq-corner span{
    width:3.5px; border-radius:2px; background:var(--amber-dim);
    height:6px;
    transform-origin:bottom;
    transition:background .2s ease;
  }
  .eq-corner.playing span{ background:var(--amber); }
  .eq-corner.playing span:nth-child(1){ animation:eqA 0.7s ease-in-out infinite; }
  .eq-corner.playing span:nth-child(2){ animation:eqB 0.9s ease-in-out infinite; animation-delay:.1s; }
  .eq-corner.playing span:nth-child(3){ animation:eqC 0.6s ease-in-out infinite; animation-delay:.05s; }
  .eq-corner.playing span:nth-child(4){ animation:eqA 0.8s ease-in-out infinite; animation-delay:.15s; }
  @keyframes eqA{ 0%,100%{ height:6px; } 50%{ height:19px; } }
  @keyframes eqB{ 0%,100%{ height:9px; } 50%{ height:14px; } }
  @keyframes eqC{ 0%,100%{ height:5px; } 50%{ height:20px; } }
</style>
</head>
<body>
<div class="app">

  <div class="display">
    <div class="top-row">
      <div><span id="liveDot" class="live-dot"></span><span id="statusLabel" class="status-label">대기 중</span></div>
      <div id="regionTag" class="region-tag">채널 없음</div>
    </div>
    <div id="stationName" class="station-name placeholder">채널을 선택하세요</div>
    <div id="subLine" class="sub-line"></div>
    <div id="fallbackLinkWrap" style="display:none; margin-top:6px;">
      <a id="fallbackLink" href="#" target="_blank" rel="noopener" style="color:var(--amber); font-size:12.5px; text-decoration:underline;">새 탭에서 스트림 직접 열기</a>
    </div>
    <div class="eq-corner" id="eqCorner"><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="transport">
    <div class="t-btn small" id="prevBtn">◀</div>
    <div class="t-btn big" id="playBtn">▶</div>
    <div class="t-btn small" id="nextBtn">▶</div>
  </div>

  <div class="section-title">
    <span>프리셋</span>
    <button class="edit-toggle" id="editToggle">프리셋 편집</button>
  </div>
  <div class="presets" id="presets"></div>

  <input class="search-box" id="searchBox" placeholder="채널 검색 (예: 부산, KBS, 교통방송)">
  <div id="channelList"></div>

</div>

<div id="toast" class="toast"></div>

<div class="mic-wrap">
  <div id="micHint" class="mic-hint"></div>
  <div class="mic-btn" id="micBtn">🎙</div>
</div>

<audio id="player"></audio>

<script>
/* =====================================================================
   1. 채널 데이터
   나중에 여기에 항목만 추가하면 방송국을 더 넣을 수 있습니다.
   type: 'static' -> url 그대로 재생

/* =====================================================================
   3. 스트림 주소 조회 + 재생
===================================================================== */
async function fetchWithFallback(url){
  const attempts = [
    () => fetch(url),
    () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)),
    () => fetch('https://corsproxy.io/?url=' + encodeURIComponent(url)),
    () => fetch('https://thingproxy.freeboard.io/fetch/' + url),
  ];
  let lastErr = null;
  for(const attempt of attempts){
    try{
      const res = await attempt();
      if(res && res.ok) return res;
    }catch(e){ lastErr = e; }
  }
  throw new Error('모든 방식으로 요청 실패: ' + url + (lastErr ? (' (' + lastErr.message + ')') : ''));
}

// 방송사가 직접 접근을 막는 채널(MBC, SBS)을 위한 중계 서버
const RELAY_PROXY = 'https://damp-bush-d9d1.jjdjckdld.workers.dev';

async function resolveStreamUrl(ch){
  if(ch.type === 'static'){
    // http:// 주소는 https 사이트에서 "안전하지 않은 콘텐츠"로 차단되므로
    // 중계 서버를 거쳐 https로 감싸서 재생
    if(ch.url.startsWith('http://')){
      return `${RELAY_PROXY}/?url=${encodeURIComponent(ch.url)}`;
    }
    return ch.url;
  }

  if(ch.type === 'kbs'){
    const res = await fetchWithFallback(`https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/${ch.code}`);
    const json = await res.json();
    const item = (json.channel_item && json.channel_item[0])
              || (json.channel && json.channel.item && json.channel.item[0]);
    if(!item || !item.service_url) throw new Error('kbs no url');
    return item.service_url;
  }

  if(ch.type === 'mbc' || ch.type === 'sbs'){
    // MBC/SBS는 직접 접근이 막혀있어서, Cloudflare Worker 중계 서버를 거쳐서 재생
    return `${RELAY_PROXY}/?url=${encodeURIComponent(ch.url)}`;
  }
  throw new Error('unknown type');
}

function stopPlayback(){
  if(hls){ hls.destroy(); hls = null; }
  player.pause();
  player.removeAttribute('src');
  player.load();
}

function playViaHlsJs(url, ch){
  return new Promise((resolve, reject)=>{
    let settled = false;
    hls = new Hls({ xhrSetup:(xhr)=>{ try{ xhr.withCredentials = false; }catch(e){} } });
    hls.loadSource(url);
    hls.attachMedia(player);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      player.play().then(()=>{
        if(!settled){ settled = true; resolve(); }
      }).catch(err=>{
        if(!settled){ settled = true; reject(err); }
      });
    });
    hls.on(Hls.Events.ERROR, (evt, data)=>{
      if(data && data.fatal){
        if(!settled){
          settled = true;
          reject(new Error('hls fatal error'));
        } else {
          // 재생 시작 후 끊긴 경우
          liveDotEl.className = 'live-dot err';
          statusLabelEl.textContent = '재생 실패';
          showToast(`${ch.name} 스트림 연결이 끊겼어요. 새 탭에서 열기를 시도해보세요.`, 4000);
          showFallbackLink();
          isPlaying = false;
        }
      }
    });
  });
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error(`${label} 응답이 너무 오래 걸려요 (시간 초과)`)), ms)),
  ]);
}

async function playChannel(id){
  const ch = byId(id);
  if(!ch) return;

  const myRequestId = ++playRequestId; // 이 호출만의 고유 번호
  currentId = id;
  isPlaying = false;
  lastStreamUrl = null;
  hideFallbackLink();
  renderDisplay('연결 중…');
  statusLabelEl.textContent = '연결 중…';
  liveDotEl.className = 'live-dot';
  stopPlayback();

  let url;
  try{
    url = await withTimeout(resolveStreamUrl(ch), 8000, `${ch.name} 조회`);
    if(myRequestId !== playRequestId) return; // 그 사이 다른 채널이 눌렸으면 이 결과는 버림
    lastStreamUrl = url;
  }catch(e){
    if(myRequestId !== playRequestId) return;
    liveDotEl.className = 'live-dot err';
    statusLabelEl.textContent = '재생 실패';
    const isFileProtocol = location.protocol === 'file:';
    const hint = isFileProtocol
      ? `${ch.name} 조회에 실패했어요. 로컬 파일(file://)로 열면 사파리가 외부 요청을 막을 수 있어요 — 서버에 올려서 열어보는 것도 시도해볼 만해요.`
      : `${ch.name} 방송사 서버 조회에 실패했어요 (${e.message || '시간 초과'}). 아래 링크로 직접 확인해보세요.`;
    showToast(hint, 4500);
    // 조회 자체가 실패해도, 원본 API 주소를 새 탭 링크로 남겨서 직접 확인할 수 있게 함
    if(ch.url){
      lastStreamUrl = ch.url;
      showFallbackLink();
    }
    saveLastChannel();
    renderChannelList();
    renderPresets();
    return;
  }

  try{
    const canNativeHls = player.canPlayType('application/vnd.apple.mpegurl') !== '' ||
                          player.canPlayType('application/x-mpegURL') !== '';

    if(url.includes('.m3u8') && canNativeHls){
      // Safari 등 HLS 자체 지원 브라우저는 hls.js를 거치지 않고 네이티브로 재생
      // (hls.js는 오디오 전용 스트림에서 "재생중" 표시는 뜨지만 무음이 되는 경우가 있음)
      player.src = url;
      await withTimeout(player.play(), 8000, `${ch.name} 재생 시작`);
    } else if(url.includes('.m3u8') && window.Hls && Hls.isSupported()){
      await withTimeout(playViaHlsJs(url, ch), 8000, `${ch.name} 재생 시작`);
    } else {
      player.src = url;
      await withTimeout(player.play(), 8000, `${ch.name} 재생 시작`);
    }
    if(myRequestId !== playRequestId) return; // 그 사이 다른 채널이 눌렸으면 반영하지 않음
    isPlaying = true;
    liveDotEl.className = 'live-dot on';
    statusLabelEl.textContent = '재생 중';
  }catch(e){
    if(myRequestId !== playRequestId) return;
    stopPlayback(); // 실패한 재생 시도 정리 — 화면/제어센터가 "재생 중"처럼 보이지 않게
    isPlaying = false;
    liveDotEl.className = 'live-dot err';
    statusLabelEl.textContent = '재생 실패';
    showToast(`${ch.name} 자동 재생이 막혔어요. 새 탭에서 열기를 시도하거나 재생 버튼을 다시 눌러주세요.`, 4200);
    showFallbackLink();
  }

  saveLastChannel();
  renderDisplay();
  renderChannelList();
  renderPresets();
}

function togglePlayPause(){
  if(!currentId) return;
  if(isPlaying){
    player.pause();
    isPlaying = false;
    statusLabelEl.textContent = '일시정지';
    liveDotEl.className = 'live-dot';
    renderDisplay();
  } else {
    if(player.src || hls){
      player.play().then(()=>{
        isPlaying = true;
        statusLabelEl.textContent = '재생 중';
        liveDotEl.className = 'live-dot on';
        renderDisplay();
      }).catch(()=>{ playChannel(currentId); });
    } else {
      playChannel(currentId);
    }
  }
}

function shiftChannel(dir){
  const idx = CHANNELS.findIndex(c=>c.id===currentId);
  let next;
  if(idx === -1) next = 0;
  else next = (idx + dir + CHANNELS.length) % CHANNELS.length;
  playChannel(CHANNELS[next].id);
}

/* =====================================================================
   MediaSession API — 차량 블루투스(AVRCP) / 이어폰 / 잠금화면 컨트롤 연동
   대부분의 차량 핸즈프리·스티어링휠 다음곡/이전곡 버튼이 이 API로 전달됩니다.
===================================================================== */
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.setActionHandler('play', ()=>{ if(!isPlaying) togglePlayPause(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ if(isPlaying) togglePlayPause(); });
    navigator.mediaSession.setActionHandler('nexttrack', ()=>{ presetOrChannelShift(1); });
    navigator.mediaSession.setActionHandler('previoustrack', ()=>{ presetOrChannelShift(-1); });
  }catch(e){ /* 일부 브라우저는 특정 액션 미지원 */ }
  // ±10/15초 건너뛰기 버튼 대신 이전/다음(프리셋) 버튼이 뜨도록 명시적으로 비활성화 시도
  try{ navigator.mediaSession.setActionHandler('seekbackward', null); }catch(e){}
  try{ navigator.mediaSession.setActionHandler('seekforward', null); }catch(e){}
  try{ navigator.mediaSession.setActionHandler('seekto', null); }catch(e){}
}

function presetOrChannelShift(dir){
  // 프리셋만 순서대로 전환 (전체 채널 목록으로는 절대 넘어가지 않음)
  const filled = presets.map((id,i)=>({id,i})).filter(p=>p.id);
  if(filled.length === 0){
    showToast('저장된 프리셋이 없어요. "프리셋 편집"에서 먼저 저장해주세요.');
    return;
  }
  const curIdx = filled.findIndex(p=>p.id === currentId);
  let nextIdx;
  if(curIdx === -1) nextIdx = 0;
  else nextIdx = (curIdx + dir + filled.length) % filled.length;
  playChannel(filled[nextIdx].id);
}

function updateMediaSession(ch){
  if(!('mediaSession' in navigator) || !ch) return;
  try{
    setupMediaSession(); // 재생될 때마다 다시 등록해서, iOS가 ±10초 버튼 대신 ⏮⏭(프리셋) 버튼을 쓰도록 함
    if(isPlaying){
      // 실제로 재생 중일 때만 제목을 갱신 — 실패했는데 제목만 바뀌어서
      // "넘어간 것처럼 보이는데 소리는 안 나는" 혼란을 막기 위함
      const iconLink = document.querySelector('link[rel="apple-touch-icon"]');
      const artwork = iconLink ? [{ src: iconLink.href, sizes: '180x180', type: 'image/png' }] : [];
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ch.name,
        artist: ch.region,
        album: '내 라디오',
        artwork,
      });
      navigator.mediaSession.playbackState = 'playing';
    } else {
      // 실패/일시정지 상태에서는 제목은 마지막 성공 채널로 유지하고, 재생 상태만 반영
      navigator.mediaSession.playbackState = 'paused';
    }
  }catch(e){ /* 무시 */ }
}

function renderPresets(){
  const wrap = document.getElementById('presets');
  wrap.className = 'presets' + (editingPresets ? ' editing' : '');
  wrap.innerHTML = '';
  presets.forEach((chId, i)=>{
    const ch = chId ? byId(chId) : null;
    const div = document.createElement('div');
    div.className = 'preset' + (!ch ? ' empty' : '') + (chId===currentId ? ' active' : '');
    div.innerHTML = `<div class="p-num">P${i+1}</div><div class="p-name">${ch ? ch.name : '비어있음 · 눌러서 저장'}</div>`;
    div.onclick = ()=>{
      if(editingPresets){
        if(!currentId){ showToast('먼저 채널을 재생한 뒤 프리셋에 저장하세요.'); return; }
        presets[i] = currentId;
        savePresets();
        renderPresets();
        showToast(`P${i+1}에 ${byId(currentId).name} 저장했어요.`);
      } else if(ch){
        playChannel(ch.id);
      } else {
        showToast('비어있는 프리셋이에요. "프리셋 편집"을 눌러 저장해보세요.');
      }
    };
    wrap.appendChild(div);
  });
}

function renderChannelList(filter=''){
  const listEl = document.getElementById('channelList');
  listEl.innerHTML = '';
  const norm = filter.trim().toLowerCase();

  GROUP_ORDER.forEach(group=>{
    let items = CHANNELS.filter(c=>c.group===group);
    if(norm){
      items = items.filter(c=>{
        const hay = (c.name+' '+c.region+' '+(c.alias||[]).join(' ')).toLowerCase();
        return hay.includes(norm);
      });
    }
    if(items.length===0) return;

    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group;
    listEl.appendChild(title);

    items.forEach(ch=>{
      const row = document.createElement('div');
      row.className = 'channel-row' + (ch.id===currentId ? ' active' : '');
      row.innerHTML = `
        <div class="c-left">
          <div class="c-name">${ch.name}</div>
          <div class="c-region">${ch.region}</div>
        </div>
        <div class="c-play-icon">${ch.id===currentId && isPlaying ? '❚❚' : '▶'}</div>
      `;
      row.onclick = ()=> playChannel(ch.id);
      listEl.appendChild(row);
    });
  });

  if(listEl.innerHTML === ''){
    listEl.innerHTML = `<div style="color:var(--text-dim);font-size:13.5px;padding:20px 4px;text-align:center;">검색 결과가 없어요.</div>`;
  }
}

/* =====================================================================
   5. 버튼 이벤트
===================================================================== */
document.getElementById('playBtn').onclick = togglePlayPause;
document.getElementById('prevBtn').onclick = ()=>presetOrChannelShift(-1);
document.getElementById('nextBtn').onclick = ()=>presetOrChannelShift(1);
document.getElementById('searchBox').oninput = (e)=> renderChannelList(e.target.value);
document.getElementById('editToggle').onclick = (e)=>{
  editingPresets = !editingPresets;
  e.target.classList.toggle('active', editingPresets);
  e.target.textContent = editingPresets ? '편집 완료' : '프리셋 편집';
  renderPresets();
};

/* =====================================================================
   6. 음성 명령
===================================================================== */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');
let recognizer = null;
let listening = false;

function setMicHint(text, show=true){
  micHint.textContent = text;
  micHint.classList.toggle('show', show && !!text);
}

function normalize(s){
  return s.toLowerCase().replace(/\s+/g,'').replace(/[.,!?~]/g,'');
}

const CONTROL_WORDS = {
  next: ['다음','다음채널','다음방송'],
  prev: ['이전','이전채널','전채널'],
  pause: ['정지','꺼줘','멈춰','일시정지'],
  play: ['재생','틀어줘','켜줘']
};

function matchChannelFromSpeech(raw){
  const n = normalize(raw);

  // 채널명/별칭 매칭: 가장 긴 별칭이 매칭되는 채널을 우선
  let best = null, bestLen = 0;
  CHANNELS.forEach(ch=>{
    const candidates = [ch.name, ...(ch.alias||[])];
    candidates.forEach(cand=>{
      const cn = normalize(cand);
      if(cn.length>=2 && n.includes(cn) && cn.length>bestLen){
        best = ch; bestLen = cn.length;
      }
    });
  });
  return best;
}

function handleSpeechResult(raw){
  const n = normalize(raw);

  if(CONTROL_WORDS.next.some(w=>n.includes(normalize(w)))){
    setMicHint(`"${raw}" → 다음 채널로 전환`);
    shiftChannel(1);
    return;
  }
  if(CONTROL_WORDS.prev.some(w=>n.includes(normalize(w)))){
    setMicHint(`"${raw}" → 이전 채널로 전환`);
    shiftChannel(-1);
    return;
  }
  if(CONTROL_WORDS.pause.some(w=>n.includes(normalize(w))) && isPlaying){
    setMicHint(`"${raw}" → 일시정지`);
    togglePlayPause();
    return;
  }

  const ch = matchChannelFromSpeech(raw);
  if(ch){
    setMicHint(`"${raw}" → ${ch.name} 재생`);
    playChannel(ch.id);
  } else {
    setMicHint(`"${raw}" 을(를) 이해하지 못했어요. 예: "부산 라디오 틀어줘"`);
    showToast('일치하는 채널을 찾지 못했어요.');
  }
}

if(SpeechRecognitionCtor){
  recognizer = new SpeechRecognitionCtor();
  recognizer.lang = 'ko-KR';
  recognizer.continuous = false;
  recognizer.interimResults = false;

  recognizer.onstart = ()=>{
    listening = true;
    micBtn.classList.add('listening');
    setMicHint('듣고 있어요…');
  };
  recognizer.onerror = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
    setMicHint('음성을 인식하지 못했어요. 다시 시도해 주세요.');
  };
  recognizer.onend = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
  recognizer.onresult = (event)=>{
    const raw = event.results[0][0].transcript;
    handleSpeechResult(raw);
  };

  micBtn.onclick = ()=>{
    if(listening){ recognizer.stop(); return; }
    try{ recognizer.start(); }
    catch(e){ setMicHint('마이크를 시작할 수 없어요.'); }
  };
} else {
  micBtn.onclick = ()=> showToast('이 브라우저는 음성 인식을 지원하지 않아요. (Chrome 권장)');
  micBtn.style.opacity = '0.5';
}

/* =====================================================================
   7. 초기화
===================================================================== */
setupMediaSession();
loadState();
</script>
